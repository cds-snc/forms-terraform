name: Build Lambda Docker image
description: Shared composite action to build a Lambda Docker image

inputs:
  lambda-folder-name:
    required: true
  push:
    required: false
    default: false
  tag:
    description: Required if 'push' set to true
    required: false
    default: local
  aws-role-to-assume:
    description: Required if 'push' set to true
    required: false
  aws-role-session-name:
    description: Required if 'push' set to true
    required: false
  aws-region:
    description: Required if 'push' set to true
    required: false

runs:
  using: "composite"
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

    - name: Configure AWS credentials
      if: ${{ inputs.push == 'true' }}
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws-role-to-assume }}
        role-session-name: ${{ inputs.aws-role-session-name }}
        aws-region: ${{ inputs.aws-region }}

    - name: Login to Amazon ECR
      if: ${{ inputs.push == 'true' }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

    - name: Build (and Push if requested) Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      env:
        IMAGE_NAME: ${{ steps.login-ecr.outputs.registry || 'local' }}/${{ inputs.lambda-folder-name }}-lambda
      with:
        platforms: linux/arm64
        provenance: false
        file: Dockerfile.lambda
        build-args: |
          LAMBDA_FOLDER_NAME=${{ inputs.lambda-folder-name }}
        tags: |
          ${{ env.IMAGE_NAME }}:${{ inputs.tag }}
          ${{ env.IMAGE_NAME }}:latest
        push: ${{ inputs.push }}
